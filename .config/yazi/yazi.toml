[mgr]
linemode = "mtime"
show_symlink = true
show_hidden = false

[opener]

edit = [
	{ run = 'nvim %s', block = true, for = "unix" },
]
play = [
	{ run = 'mpv %s', orphan = false, for = "unix" },
]
open = [
	{ run = 'xdg-open %s1', desc = "xdg" },
]
browser = [
    { run = 'librewolf %s', orphan = true, for = "unix" },
]
image-edit = [
    { run = 'gimp %s', orphan = true, for = "unix" },
]
pdf-edit = [
    { run = 'pdfarranger %s', orphan = true, for = "unix" },
]
xournal = [
    { run = 'xournalpp %s', orphan = true, for = "unix" },
]
sqlite = [
    { run ='sqlitebrowser %s', orphan = false, for = "unix"}
]
libre_calc= [
    { run ='localc %s', orphan = true, for = "unix"}
]



[open]
prepend_rules = [
	{ mime = "image/*", use = [ "browser", "image-edit" ] },
	{ mime = "application/pdf", use = [ "browser", "pdf-edit", "xournal" ] },
    { url = "*.db", use = [ "sqlite" ] },
    { url = "*.txt", use = [ "edit" ] },
	{ url = "*.csv", use = [ "libre_calc", "edit" ] },
]   
