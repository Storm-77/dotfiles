# Static snapshot of the active tmux theme; no pywal dependency.
set -g @prefix_highlight_bg "#572E95"
set -g @prefix_highlight_copy_mode_attr "fg=#05050d,bg=#572E95"
set -g @prefix_highlight_fg "#05050d"
set -g @prefix_highlight_output_prefix "  "

set -g status on
set -g status-style "bg=#05050d,fg=#cbccc6"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left-style default
set -g status-right-style default
set -g status-left "#[fg=#05050d,bg=#572E95,bold]   #S #{prefix_highlight}#[fg=#572E95,bg=#05050d,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#5A54A7,bg=#05050d,nounderscore,noitalics]  #[fg=#CBCCC6,bg=#05050d,nounderscore,noitalics]%R #[fg=#9764BD,bg=#05050d,nounderscore,noitalics]   #[fg=#CBCCC6,bg=#05050d,nounderscore,noitalics]%d.%m.%Y #[fg=#555567,bg=#05050d]#[fg=#555567,bg=#555567]#[fg=#CBCCC6, bg=#555567]#[fg=#05050d,bg=#555567,nobold,nounderscore,noitalics]#[fg=#572E95,bg=#05050d,nobold,nounderscore,noitalics]#[fg=#05050d,bg=#572E95,bold] #h "

set -gw display-panes-active-colour "#1F5799"
set -gw display-panes-colour "#5A54A7"
set -gw window-style "fg=#c0c0c2"
set -gw window-active-style "fg=#CBCCC6"
set -gw window-status-style default
set -gw window-status-activity-style reverse
set -gw window-status-current-style underscore
set -gw window-status-separator ''
set -gw window-status-format "#[fg=#05050d,bg=#05050d,nobold,nounderscore,noitalics]#[fg=#CBCCC6,bg=#05050d] #I  #W #[fg=#05050d,bg=#05050d,nobold,nounderscore,noitalics]"
set -gw window-status-current-format "#[fg=#05050d,bg=#1F5799,nobold,nounderscore,noitalics]#[fg=#05050d,bg=#1F5799,nobold] #I  #W #[fg=#1F5799,bg=#05050d,nobold,nounderscore,noitalics]"
